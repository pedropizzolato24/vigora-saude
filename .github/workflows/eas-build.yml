name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# Least privilege: só faz checkout e sobe o APK como artifact do run.
permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo Prebuild (gera projeto Android nativo)
        run: npx expo prebuild --platform android --non-interactive
        env:
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          # App Links nativos (intent filter https://<host>/convite) — lido em app.config.ts
          EXPO_PUBLIC_LINK_HOST: app.vigorasaude.com
          EXPO_PUBLIC_LINK_BASE_URL: https://app.vigorasaude.com

      - name: Aumenta o heap do Gradle (evita OOM flaky no packaging do release)
        run: |
          # android/ é regenerado pelo prebuild acima; sobrescreve o -Xmx padrão
          # (2g). :app:packageRelease (IncrementalSplitterRunnable, 2 ABIs) vinha
          # estourando a RAM do runner de forma não-determinística — mesmo commit
          # já falhou e passou sem nenhuma mudança. Em .properties a última
          # ocorrência da chave vence, então basta anexar.
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Bundle JavaScript (debug standalone)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
        env:
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          # Client IDs OAuth Google (públicos, embutidos no bundle JS).
          # Android = client da assinatura DEBUG (mesmo valor do profile dev no eas.json).
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 39705729598-cm5s8hs0rare5smst57l1gbin9obt0u1.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 39705729598-0q57pbi4hmfd231rkbld2ftgh9eqcidg.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 39705729598-q49ldjevjp58hg9tvre49tphuo076s08.apps.googleusercontent.com
          EXPO_PUBLIC_LINK_HOST: app.vigorasaude.com
          EXPO_PUBLIC_LINK_BASE_URL: https://app.vigorasaude.com

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          # Simetria com o release: garante as vars caso o gradle re-bundle o debug.
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 39705729598-cm5s8hs0rare5smst57l1gbin9obt0u1.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 39705729598-0q57pbi4hmfd231rkbld2ftgh9eqcidg.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 39705729598-q49ldjevjp58hg9tvre49tphuo076s08.apps.googleusercontent.com
          EXPO_PUBLIC_LINK_HOST: app.vigorasaude.com
          EXPO_PUBLIC_LINK_BASE_URL: https://app.vigorasaude.com

      - name: Verify client_id e chave RevenueCat no bundle do APK (debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/index.android.bundle > /tmp/bundle.js || true
          grep -q "39705729598" /tmp/bundle.js \
            || { echo "::error::Client ID Google ausente no bundle do APK de debug"; exit 1; }
          grep -aqE 'goog_[A-Za-z0-9]{10,}' /tmp/bundle.js \
            || { echo "::error::Chave pública RevenueCat (goog_) ausente no bundle do APK de debug — defina o secret EXPO_PUBLIC_REVENUECAT_API_KEY"; exit 1; }
          if grep -aqE '"sk_[A-Za-z0-9]{20,}' /tmp/bundle.js; then
            echo "::error::Secret key sk_ do RevenueCat encontrada no bundle — nunca deve ir ao cliente"; exit 1;
          fi
          echo "OK: client_id + chave RevenueCat (goog_) presentes; sem secret sk_ no bundle de debug"

      - name: Bundle JavaScript (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
        env:
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          # Client IDs OAuth Google (públicos, embutidos no bundle JS).
          # Android = client da assinatura RELEASE (mesmo valor do profile production no eas.json).
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 39705729598-iv01adn3g5di03k6ukp9n02mri393s6n.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 39705729598-0q57pbi4hmfd231rkbld2ftgh9eqcidg.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 39705729598-q49ldjevjp58hg9tvre49tphuo076s08.apps.googleusercontent.com
          EXPO_PUBLIC_LINK_HOST: app.vigorasaude.com
          EXPO_PUBLIC_LINK_BASE_URL: https://app.vigorasaude.com

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          # Gradle re-bundla o JS (createBundleReleaseJsAndAssets) e gera o bundle
          # que de fato vai no APK — então as EXPO_PUBLIC_* precisam existir AQUI também.
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 39705729598-iv01adn3g5di03k6ukp9n02mri393s6n.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 39705729598-0q57pbi4hmfd231rkbld2ftgh9eqcidg.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 39705729598-q49ldjevjp58hg9tvre49tphuo076s08.apps.googleusercontent.com
          EXPO_PUBLIC_LINK_HOST: app.vigorasaude.com
          EXPO_PUBLIC_LINK_BASE_URL: https://app.vigorasaude.com
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify client_id e chave RevenueCat no bundle do APK (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > /tmp/bundle.js || true
          grep -q "39705729598" /tmp/bundle.js \
            || { echo "::error::Client ID Google ausente no bundle do APK de release"; exit 1; }
          grep -aqE 'goog_[A-Za-z0-9]{10,}' /tmp/bundle.js \
            || { echo "::error::Chave pública RevenueCat (goog_) ausente no bundle do APK de release — defina o secret EXPO_PUBLIC_REVENUECAT_API_KEY"; exit 1; }
          if grep -aqE '"sk_[A-Za-z0-9]{20,}' /tmp/bundle.js; then
            echo "::error::Secret key sk_ do RevenueCat encontrada no bundle — nunca deve ir ao cliente"; exit 1;
          fi
          echo "OK: client_id + chave RevenueCat (goog_) presentes; sem secret sk_ no bundle de release"

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: vigora-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: vigora-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
